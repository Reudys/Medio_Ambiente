name: medio_ambiente
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  image_picker: ^1.0.0
  geolocator: ^10.0.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  permission_handler: ^11.0.0
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  video_player: ^2.5.0
  provider: ^6.1.1
  youtube_player_flutter: ^9.1.3
  google_maps_flutter: ^2.6.1
  shared_preferences: ^2.5.4
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.1.10
  open_filex: ^3.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.jpg"
  

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/icon.jpg
    - assets/docs/Agua.pdf
    - assets/docs/Recursos.pdf
    - assets/docs/Residuos.pdf

